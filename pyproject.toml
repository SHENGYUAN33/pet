[project]
name = "pet-adoption-video"
version = "0.1.0"
description = "Generate 30s pet adoption short videos from real pet profiles and media (PoC, open-source AI stack)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "coqui-tts>=0.24",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]
# torch needs a CUDA-matched wheel, not a plain `pip install torch` — for a
# Blackwell (RTX 50-series) GPU that means the cu128 index, e.g.:
#   pip install torch --index-url https://download.pytorch.org/whl/cu128
# Install that first, then `pip install -e ".[i2v]"` for the rest.
i2v = [
    "diffusers>=0.30",
    "transformers>=4.44",
    "accelerate>=0.33",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "pillow>=10.0",
]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "pipeline",
    "providers",
    "providers.llm",
    "providers.tts",
    "providers.video",
    "webapp",
]
